server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
                default_type text/html;
                return 200 '<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pollpear health</title>
    </head>
    <body>
        <main>OK</main>
    </body>
</html>';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
