name: CI

on:
  pull_request:
    branches: [dev, main, staging]
  push:
    branches: ["dev"]
  repository_dispatch:
    types: [ci-trigger]
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI front déclenché"

  ci:
    permissions:
      contents: read
      pull-requests: read
    needs: trigger
    uses: transummer2026/.github/.github/workflows/ci-service.yml@main
    with:
      service_name: frontend
      install_cmd: npm ci
      lint_cmd: npx eslint .
      test_cmd: npm test -- --run
      build_cmd: npm run build
      audit_cmd: npm audit --audit-level=high
      coverage_cmd: npm test -- --run --coverage
      coverage_format: lcov
      coverage_threshold: 0
    secrets:
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DISCORD_WEBHOOK_REPO: ${{ secrets.DISCORD_WEBHOOK_FRONT }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      SEMANTIC_TOKEN: ${{ secrets.SEMANTIC_TOKEN }}
